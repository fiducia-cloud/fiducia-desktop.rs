[package]
name = "fiducia-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Formally specified native Fiducia operator desktop shell"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = []
desktop-ui = ["dep:gpui"]

[dependencies]
gpui = { version = "=0.2.2", optional = true }
url = "=2.5.8"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "fiducia-desktop"
path = "src/main.rs"
required-features = ["desktop-ui"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
